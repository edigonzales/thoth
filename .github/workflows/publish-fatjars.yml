name: Publish FatJars

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  publish-fatjars:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: 'gradle'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Determine project version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(./gradlew -q :thoth-blog:properties | awk -F': ' '/^version: / { print $2; exit }')
          if [[ -z "$VERSION" ]]; then
            echo "Could not determine project version" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            echo "is_snapshot=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_snapshot=false" >> "$GITHUB_OUTPUT"
          fi

          echo "Resolved version: $VERSION"

      - name: Run all tests (unit, integration, e2e)
        run: ./gradlew --no-daemon test integrationTest e2eTest

      - name: Upload test logs and reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-and-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**

      - name: Publish fatjars to Maven repository (snapshot only)
        if: steps.version.outputs.is_snapshot == 'true'
        env:
          MAVEN_REPOSITORY_URL: ${{ secrets.MAVEN_REPOSITORY_URL }}
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
        run: ./gradlew --no-daemon :thoth-blog:publish :thoth-biblios:publish

      - name: Build when not a snapshot
        if: steps.version.outputs.is_snapshot != 'true'
        run: ./gradlew --no-daemon assemble

  native-server:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: 'gradle'

      - name: Build native server binary
        run: ./gradlew --no-daemon :thoth-biblios-server:nativeCompile

      - name: Generate smoke package
        run: ./gradlew --no-daemon :thoth-biblios-server:generateSmokePackage

      - name: Smoke test native binary
        run: |
          set -euo pipefail
          BIBLIOS_PORT=8080 \
          BIBLIOS_PACKAGE=thoth-biblios-server/build/smoke-package/package \
          BIBLIOS_ACCESS_CONFIG=thoth-biblios-server/build/smoke-package/access.yml \
          ./thoth-biblios-server/build/native/nativeCompile/thoth-biblios-server &
          SERVER_PID=$!
          for i in $(seq 1 100); do
            if curl -sf http://localhost:8080/ > /dev/null; then break; fi
            sleep 0.3
          done
          curl -sf http://localhost:8080/ | grep -q "Access Test Portal"
          curl -sf -o /dev/null http://localhost:8080/api/search-index
          kill "$SERVER_PID"

      - name: Upload native binary
        uses: actions/upload-artifact@v4
        with:
          name: thoth-biblios-server-linux-amd64
          path: thoth-biblios-server/build/native/nativeCompile/thoth-biblios-server
