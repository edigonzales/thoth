name: Publish FatJars

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  publish-fatjars:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Determine project version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(./gradlew -q :thoth-blog:properties | awk -F': ' '/^version: / { print $2; exit }')
          if [[ -z "$VERSION" ]]; then
            echo "Could not determine project version" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            echo "is_snapshot=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_snapshot=false" >> "$GITHUB_OUTPUT"
          fi

          echo "Resolved version: $VERSION"

      - name: Publish fatjars to Maven repository (snapshot only)
        if: steps.version.outputs.is_snapshot == 'true'
        env:
          MAVEN_REPOSITORY_URL: ${{ secrets.MAVEN_REPOSITORY_URL }}
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
        run: ./gradlew --no-daemon :thoth-blog:publish :thoth-biblios:publish

      - name: Build and test when not a snapshot
        if: steps.version.outputs.is_snapshot != 'true'
        run: ./gradlew --no-daemon build
