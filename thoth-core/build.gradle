plugins {
    id 'java-library'
}

description = 'Common technical infrastructure for Thoth products'

dependencies {
    // Shared dependencies - technical infrastructure only.
    // Intentionally not exposed as 'api' so that product modules declare the
    // libraries they use directly. This keeps the dependency surface small for
    // consumers that only need lightweight infrastructure (e.g. the Biblios server).
    implementation 'org.freemarker:freemarker:2.3.34'
    implementation 'org.asciidoctor:asciidoctorj:3.0.1'
    implementation 'org.jsoup:jsoup:1.22.1'
    
    testImplementation 'org.junit.jupiter:junit-jupiter:5.14.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
