plugins {
    id 'java'
}

// Root project - no application plugin, just common configuration
group = 'guru.interlis'
version = '0.0.1'

subprojects {
    apply plugin: 'java'
    
    group = 'guru.interlis'
    version = '0.0.1'
    
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }
    
    repositories {
        mavenCentral()
    }
    
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
    
    test {
        useJUnitPlatform()
    }
}
