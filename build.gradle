import groovy.json.JsonSlurper
import java.nio.file.Files

plugins {
    id 'java'
}

apply from: "$rootDir/gradle/versioning.gradle"

group = 'guru.interlis'

def interlisLabVersion = providers.gradleProperty('interlisLabVersion').orElse('0.1.10').get()
def interlisLabPackageMetadataUrl = providers.gradleProperty('interlisLabPackageMetadataUrl')
    .orElse('https://codeberg.org/api/packages/edigonzales/npm/@edigonzales%2Finterlis-lab-web-component')
    .get()
def interlisLabTarballUrlOverride = providers.gradleProperty('interlisLabTarballUrl').orNull

ext.interlisLabVersion = interlisLabVersion

def interlisLabWorkDir = layout.buildDirectory.dir("interlis-lab/${interlisLabVersion}")
def interlisLabDistDir = layout.buildDirectory.dir("interlis-lab/${interlisLabVersion}/dist")

tasks.register('resolveInterlisLabPackage') {
    group = 'build setup'
    description = 'Downloads @edigonzales/interlis-lab-web-component assets from Codeberg and extracts dist/interlis-lab.js + dist/ili2c.jar.'

    inputs.property('interlisLabVersion', interlisLabVersion)
    inputs.property('interlisLabPackageMetadataUrl', interlisLabPackageMetadataUrl)
    inputs.property('interlisLabTarballUrl', interlisLabTarballUrlOverride ?: '')
    outputs.dir(interlisLabDistDir)

    doLast {
        def version = interlisLabVersion
        def metadataUrl = interlisLabPackageMetadataUrl
        def tarballUrlOverride = interlisLabTarballUrlOverride
        def workDir = interlisLabWorkDir.get().asFile
        def distDir = interlisLabDistDir.get().asFile
        def extractDir = new File(workDir, 'extract')
        def metadataFile = new File(workDir, 'package-metadata.json')
        def tarballFile = new File(workDir, "interlis-lab-web-component-${version}.tgz")

        project.delete(workDir)
        distDir.mkdirs()

        def downloadToFile = { String sourceUrl, File targetFile ->
            targetFile.parentFile.mkdirs()
            logger.lifecycle("Downloading ${sourceUrl}")
            def connection = new URL(sourceUrl).openConnection()
            connection.setConnectTimeout(15_000)
            connection.setReadTimeout(180_000)
            connection.setRequestProperty('User-Agent', "thoth/${project.version}")
            connection.inputStream.withCloseable { input ->
                Files.copy(input, targetFile.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            }
        }

        String tarballUrl
        if (tarballUrlOverride != null && !tarballUrlOverride.isBlank()) {
            tarballUrl = tarballUrlOverride
            logger.lifecycle("Using overridden interlis-lab tarball URL: ${tarballUrl}")
        } else {
            downloadToFile(metadataUrl, metadataFile)
            def metadata = new JsonSlurper().parse(metadataFile)
            def selectedVersion = metadata?.versions?.get(version)
            if (!(selectedVersion instanceof Map)) {
                throw new GradleException("interlis-lab version '${version}' not found at ${metadataUrl}")
            }
            tarballUrl = selectedVersion?.dist?.tarball
            if (!(tarballUrl instanceof String) || tarballUrl.isBlank()) {
                throw new GradleException("No dist.tarball URL found for interlis-lab version '${version}'")
            }
        }

        downloadToFile(tarballUrl, tarballFile)
        project.delete(extractDir)
        extractDir.mkdirs()

        copy {
            from tarTree(resources.gzip(tarballFile))
            include 'package/dist/interlis-lab.js'
            include 'package/dist/ili2c.jar'
            eachFile { it.path = it.name }
            includeEmptyDirs = false
            into distDir
        }

        def componentJs = new File(distDir, 'interlis-lab.js')
        def ili2cJar = new File(distDir, 'ili2c.jar')
        if (!componentJs.exists() || !ili2cJar.exists()) {
            throw new GradleException("Downloaded package ${version} does not contain dist/interlis-lab.js and dist/ili2c.jar")
        }

        logger.lifecycle("Resolved interlis-lab assets version ${version} to ${distDir}")
    }
}

def wireInterlisLabAssets = { Project proj ->
    def moduleGeneratedResourcesDir = proj.layout.buildDirectory.dir('generated-resources')
    def moduleAssetDir = proj.layout.buildDirectory.dir('generated-resources/site-assets/interlis-lab')
    def prepareTask = proj.tasks.register('prepareInterlisLabAssets', Sync) {
        group = 'build setup'
        description = "Copies resolved interlis-lab assets into ${proj.name} resources"
        dependsOn rootProject.tasks.named('resolveInterlisLabPackage')
        from(interlisLabDistDir) {
            include 'interlis-lab.js'
            include 'ili2c.jar'
        }
        into moduleAssetDir
    }

    proj.sourceSets.main.resources.srcDir(moduleGeneratedResourcesDir)
    proj.tasks.named('processResources') {
        dependsOn prepareTask
    }
}

subprojects {
    apply plugin: 'java'

    group = 'guru.interlis'
    version = '0.0.1-SNAPSHOT'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    repositories {
        mavenCentral()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    test {
        useJUnitPlatform()
    }

    // ========================================
    // Integration Test Source Set (all modules)
    // ========================================
    sourceSets {
        integrationTest {
            java {
                srcDir 'src/integrationTest/java'
            }
            resources {
                srcDir 'src/integrationTest/resources'
            }
            compileClasspath += sourceSets.main.output + sourceSets.test.output + configurations.testCompileClasspath
            runtimeClasspath += sourceSets.main.output + sourceSets.test.output + configurations.testRuntimeClasspath
        }
    }

    configurations {
        integrationTestImplementation.extendsFrom testImplementation
        integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
    }

    tasks.register('integrationTest', Test) {
        group = 'verification'
        description = 'Runs integration tests.'
        testClassesDirs = sourceSets.integrationTest.output.classesDirs
        classpath = sourceSets.integrationTest.runtimeClasspath
        useJUnitPlatform()
        shouldRunAfter test
    }

    // ========================================
    // E2E Test Source Set (all modules)
    // ========================================
    sourceSets {
        e2eTest {
            java {
                srcDir 'src/e2eTest/java'
            }
            resources {
                srcDir 'src/e2eTest/resources'
            }
            compileClasspath += sourceSets.main.output + sourceSets.test.output + configurations.testCompileClasspath
            runtimeClasspath += sourceSets.main.output + sourceSets.test.output + configurations.testRuntimeClasspath
        }
    }

    configurations {
        e2eTestImplementation.extendsFrom testImplementation
        e2eTestRuntimeOnly.extendsFrom testRuntimeOnly
    }

    tasks.register('e2eTest', Test) {
        group = 'verification'
        description = 'Runs end-to-end (E2E) tests.'
        testClassesDirs = sourceSets.e2eTest.output.classesDirs
        classpath = sourceSets.e2eTest.runtimeClasspath
        useJUnitPlatform()
        shouldRunAfter integrationTest
    }
}

// ========================================
// Shared conventions for CLI application modules
// Applied to thoth-blog and thoth-biblios
// ========================================
def configureCliModule = { Project proj ->
    proj.apply plugin: 'maven-publish'

    // JAR manifest with version from build
    proj.jar {
        manifest {
            attributes(
                'Implementation-Title': proj.description ?: proj.name,
                'Implementation-Version': proj.version,
                'Main-Class': proj.application.mainClass.get()
            )
        }
    }

    // fatJar convention – same pattern for all CLI modules
    proj.tasks.register('fatJar', Jar) {
        group = 'build'
        description = "Assembles an executable fat jar for ${proj.name}"
        archiveBaseName = proj.name
        archiveClassifier = 'all'
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE

        manifest {
            attributes(
                'Implementation-Title': proj.description ?: proj.name,
                'Implementation-Version': proj.version,
                'Main-Class': proj.application.mainClass.get()
            )
        }

        // WICHTIG: Signaturdateien aus eingebetteten JARs ausschließen
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.DSA'
        exclude 'META-INF/*.RSA'
        exclude 'META-INF/INDEX.LIST'

        from proj.sourceSets.main.output
        dependsOn proj.configurations.runtimeClasspath
        from {
            proj.configurations.runtimeClasspath
                .findAll { it.name.endsWith('.jar') }
                .collect { zipTree(it) }
        }
    }
    proj.tasks.named('build') {
        dependsOn proj.tasks.named('fatJar')
    }

    proj.publishing {
        publications {
            fatJar(MavenPublication) {
                groupId = proj.group
                artifactId = proj.name
                version = proj.version.toString()
                artifact(proj.tasks.named('fatJar'))
            }
        }
        repositories {
            maven {
                name = 'remote'
                url = uri(System.getenv('MAVEN_REPOSITORY_URL') ?: 'https://invalid.example.local/repository')
                credentials {
                    username = System.getenv('MAVEN_USERNAME')
                    password = System.getenv('MAVEN_PASSWORD')
                }
            }
        }
    }

    proj.tasks.withType(org.gradle.api.publish.maven.tasks.PublishToMavenRepository).configureEach {
        doFirst {
            def missingEnv = ['MAVEN_REPOSITORY_URL', 'MAVEN_USERNAME', 'MAVEN_PASSWORD']
                .findAll { !System.getenv(it) }
            if (!missingEnv.isEmpty()) {
                throw new GradleException(
                    "Missing required environment variables for publishing: ${missingEnv.join(', ')}"
                )
            }
        }
    }
}

// ---- thoth-core ----
project(':thoth-core') {
    dependencies {
        testImplementation 'org.junit.jupiter:junit-jupiter:5.14.2'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
}

// ---- thoth-blog ----
project(':thoth-blog') {
    apply plugin: 'application'
    apply plugin: 'jacoco'

    application {
        mainClass = 'guru.interlis.thoth.blog.ThothBlogCli'
    }

    dependencies {
        implementation project(':thoth-core')
        implementation 'info.picocli:picocli:4.7.7'

        testImplementation 'org.junit.jupiter:junit-jupiter:5.14.2'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    // JaCoCo coverage – runs after all test types
    jacoco {
        toolVersion = '0.8.13'
    }

    jacocoTestReport {
        dependsOn test, integrationTest, e2eTest
        executionData fileTree(project.buildDir).include('jacoco/*.exec')
        reports {
            html.required = true
            xml.required = false
        }
    }

    wireInterlisLabAssets(delegate)

    // Apply shared CLI conventions
    configureCliModule(delegate)
}

// ---- thoth-biblios ----
project(':thoth-biblios') {
    apply plugin: 'application'
    apply plugin: 'jacoco'

    application {
        mainClass = 'guru.interlis.thoth.biblios.ThothBibliosCli'
    }

    dependencies {
        implementation project(':thoth-core')
        implementation 'info.picocli:picocli:4.7.7'
        implementation 'org.snakeyaml:snakeyaml-engine:2.9'
        implementation 'org.eclipse.jgit:org.eclipse.jgit:7.1.0.202411261347-r'
        implementation 'org.asciidoctor:asciidoctorj-pdf:2.3.6'
        implementation 'org.docx4j:docx4j-JAXB-ReferenceImpl:11.5.12'

        testImplementation 'org.junit.jupiter:junit-jupiter:5.14.2'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    // JaCoCo coverage – same convention as thoth-blog
    jacoco {
        toolVersion = '0.8.13'
    }

    tasks.named('test', Test) {
        maxHeapSize = '1024m'
    }

    tasks.named('integrationTest', Test) {
        // Integration tests run heavy PDF/DOCX renderers; isolate worker state
        // and allow a larger heap to avoid cumulative OOM across long suites.
        maxHeapSize = '2048m'
        maxParallelForks = 1
        forkEvery = 1
        jvmArgs '-XX:+HeapDumpOnOutOfMemoryError'
    }

    tasks.named('e2eTest', Test) {
        // E2E suite renders large fixtures (HTML/PDF/DOCX) and can OOM on JDK 25 with 1G heap.
        maxHeapSize = '2048m'
    }

    jacocoTestReport {
        dependsOn test, integrationTest, e2eTest
        executionData fileTree(project.buildDir).include('jacoco/*.exec')
        reports {
            html.required = true
            xml.required = false
        }
    }

    wireInterlisLabAssets(delegate)

    // Apply shared CLI conventions
    configureCliModule(delegate)
}
